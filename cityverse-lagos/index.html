<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityVerse Lagos</title><style>body{margin:0;background:#10212b;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header,nav,.phone,.controls{position:absolute;background:#142b36e9;border-radius:22px;padding:12px;box-shadow:0 6px 25px #0007}header{top:12px;left:50%;transform:translateX(-50%);white-space:nowrap}nav{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{border:0;background:#236657;color:white;border-radius:14px;padding:12px;cursor:pointer}.controls{bottom:14px;left:10px;display:grid;grid-template-columns:repeat(3,36px);gap:3px;padding:5px}.controls button{padding:8px}.phone{display:none;right:12px;bottom:85px;width:260px;height:390px;overflow:auto;border:4px solid #c2a55d;background:linear-gradient(#07604a,#16a47a)}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.apps button{min-height:65px;background:#ffffff30}.notice{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#182c39;border-radius:20px;padding:12px;display:none}</style><header>🌙 Lagos · 😊 Happy · ₦<span id="cash">50,000</span></header><canvas id="map"></canvas><div id="notice" class="notice"></div><nav><button onclick="goHome()">🏠 Home</button><button onclick="draw()">🗺 Map</button><button onclick="togglePhone()">📱 Phone</button></nav><div class="controls"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="move(0,1)">▼</button><button onclick="move(1,0)">▶</button></div><div id="phone" class="phone"><h2>📱 CityVerse</h2><p>Your Lagos life, your story.</p><div class="apps" id="apps"></div><p id="details"></p></div><script>const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),phone=document.getElementById('phone'),cashEl=document.getElementById('cash');let px=0,py=0,money=50000;const places=[['🏠','Home',0,0],['🛒','Market',3,1],['💼','Jobs',-3,0],['🎮','Arcade',-2,-3],['⛽','Fuel',3,-3],['💇','Salon',-4,3],['🏨','Hotel',2,4],['🏦','Bank',-1,4],['🍲','Restaurant',4,3],['🚕','Taxi',-4,-3],['🏋️','Fitness',0,-4]];const appNames=['💼 Jobs','💬 Messages','🎮 Games','🛍 Shop','🏦 Bank','🚗 Cars','🏠 Houses','🎫 Events','👥 Friends','⚙️ Settings'];document.getElementById('apps').innerHTML=appNames.map(a=>'<button onclick="openApp(this.textContent)">'+a+'</button>').join('');function openApp(a){let d=document.getElementById('details');d.textContent=a+' — demo';if(a.includes('Jobs'))d.innerHTML='<button onclick="money+=2500;update();alert(\'Delivery complete: +₦2,500\')">Complete delivery (+₦2,500)</button>';if(a.includes('Shop'))d.innerHTML='<button onclick="if(money>=500){money-=500;update();alert(\'Food purchased\')}">Buy food (₦500)</button>'}function update(){cashEl.textContent=money.toLocaleString()}function togglePhone(){phone.style.display=phone.style.display==='block'?'none':'block'}function toast(s){const e=document.getElementById('notice');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1700)}function iso(a,b){const scale=Math.min(innerWidth/11,innerHeight/12);return [innerWidth/2+(a-b)*scale*.62,innerHeight/2+(a+b)*scale*.32]}function polygon(p,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...p[0]);p.slice(1).forEach(q=>ctx.lineTo(...q));ctx.closePath();ctx.fill()}function draw(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#34594b';ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=-6;i<=6;i++){for(let axis=0;axis<2;axis++){const a=axis?iso(-6,i):iso(i,-6),b=axis?iso(6,i):iso(i,6);ctx.strokeStyle='#557b6c';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}}for(let i=-5;i<=5;i++){for(const [a,b] of [[i,0],[0,i]]){const p=iso(a,b),q=iso(a+1,b),r=iso(a+1,b+1),s=iso(a,b+1);polygon([p,q,r,s],'#273d4c')}}places.forEach(([emoji,name,a,b],i)=>{const [sx,sy]=iso(a,b),h=25+(i%3)*13;polygon([[sx-21,sy],[sx,sy-11],[sx+21,sy],[sx,sy+11]],'#71818b');polygon([[sx-21,sy-h],[sx,sy-11-h],[sx,sy+11-h],[sx-21,sy]],'#445269');polygon([[sx,sy-11-h],[sx+21,sy-h],[sx+21,sy],[sx,sy+11-h]],'#354158');polygon([[sx-21,sy-h],[sx,sy-11-h],[sx+21,sy-h],[sx,sy+11-h]],'#8c9bb1');ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#12232d';ctx.fillRect(sx-40,sy-h-30,80,20);ctx.fillStyle='white';ctx.fillText(emoji+' '+name,sx,sy-h-16)});const [ax,ay]=iso(px,py);ctx.fillStyle='#eeb274';ctx.beginPath();ctx.arc(ax,ay-20,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1d293d';ctx.fillRect(ax-7,ay-11,14,22);ctx.fillStyle='white';ctx.fillText('You',ax,ay-36)}function move(a,b){px=Math.max(-5,Math.min(5,px+a));py=Math.max(-5,Math.min(5,py+b));draw();const p=places.find(q=>q[2]===px&&q[3]===py);if(p)toast('Arrived at '+p[1])}function goHome(){px=0;py=0;draw();toast('Welcome home!')}addEventListener('resize',draw);addEventListener('keydown',e=>{if(['ArrowUp','w'].includes(e.key))move(0,-1);if(['ArrowDown','s'].includes(e.key))move(0,1);if(['ArrowLeft','a'].includes(e.key))move(-1,0);if(['ArrowRight','d'].includes(e.key))move(1,0)});draw();</script></html>
